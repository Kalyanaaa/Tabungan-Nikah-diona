<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tabungan Dion & Nana</title>
  <style>
    body {
      background-color: #ffe6f0;
      font-family: 'Segoe UI', sans-serif;
      color: #333;
      padding: 2rem;
    }

    h1 {
      color: #cc3366;
      text-align: center;
    }

    .input-section {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-width: 400px;
      margin: 0 auto;
      background: #fff0f5;
      padding: 1.5rem;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    input[type="number"] {
      padding: 0.5rem;
      font-size: 1rem;
      border: 1px solid #fcb6d0;
      border-radius: 5px;
    }

    button {
      background-color: #f88fb5;
      color: white;
      padding: 0.6rem;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background-color: #e0669e;
    }

    .result {
      margin-top: 2rem;
      text-align: center;
    }

    .result h3 {
      color: #d14a7e;
    }

    .footer {
      margin-top: 3rem;
      text-align: center;
      font-size: 0.9rem;
      color: #666;
    }
  </style>
</head>
<body>

  <h1>Catatan Tabungan Dion & Nana</h1>

  <div class="input-section">
    <label for="nana">Masukkan Tabungan Nana (Rp):</label>
    <input type="number" id="nana" placeholder="Contoh: 100000" />

    <label for="dion">Masukkan Tabungan Dion (Rp):</label>
    <input type="number" id="dion" placeholder="Contoh: 150000" />

    <button onclick="hitungTabungan()">Hitung Total</button>
  </div>

  <div class="result" id="hasil">
    <!-- Hasil akan muncul di sini -->
  </div>

  <div class="footer">
    Dibuat untuk mencatat perjalanan tabungan pernikahan 💕
  </div>

  <script>
    function formatRupiah(angka) {
      return new Intl.NumberFormat('id-ID', {
        style: 'currency',
        currency: 'IDR'
      }).format(angka);
    }

    function hitungTabungan() {
      const nana = parseInt(document.getElementById('nana').value) || 0;
      const dion = parseInt(document.getElementById('dion').value) || 0;
      const total = nana + dion;

      document.getElementById('hasil').innerHTML = `
        <h3>Hasil Tabungan:</h3>
        <p>Tabungan Nana: <strong>${formatRupiah(nana)}</strong></p>
        <p>Tabungan Dion: <strong>${formatRupiah(dion)}</strong></p>
        <p>Total Tabungan: <strong>${formatRupiah(total)}</strong></p>
      `;
    }
  </script>

</body>
</html>
