<script>
  const form = document.getElementById('tabunganForm');
  const tbody = document.querySelector('#tabelHasil tbody');
  const totalDionEl = document.getElementById('totalDion');
  const totalNanaEl = document.getElementById('totalNana');
  const totalSemuaEl = document.getElementById('totalSemua');

  let tabunganList = [];

  // Load dari local storage saat pertama kali dibuka
  window.onload = () => {
    const dataTersimpan = localStorage.getItem('tabunganList');
    if (dataTersimpan) {
      tabunganList = JSON.parse(dataTersimpan);
      renderTable();
    }
  };

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    const tanggal = document.getElementById('tanggal').value;
    const nama = document.getElementById('nama').value;
    const jumlah = parseInt(document.getElementById('jumlah').value);

    tabunganList.push({ tanggal, nama, jumlah });
    simpanKeLocalStorage();
    renderTable();
    form.reset();
  });

  function renderTable() {
    tbody.innerHTML = '';
    let totalDion = 0;
    let totalNana = 0;

    tabunganList.forEach((item, index) => {
      const row = tbody.insertRow();
      row.innerHTML = `
        <td>${item.tanggal}</td>
        <td>${item.nama}</td>
        <td>Rp ${item.jumlah.toLocaleString()}</td>
        <td class="actions">
          <button onclick="editData(${index})">Edit</button>
          <button onclick="hapusData(${index})">Hapus</button>
        </td>
      `;

      if (item.nama === 'Dion') totalDion += item.jumlah;
      if (item.nama === 'Nana') totalNana += item.jumlah;
    });

    totalDionEl.textContent = `Rp ${totalDion.toLocaleString()}`;
    totalNanaEl.textContent = `Rp ${totalNana.toLocaleString()}`;
    totalSemuaEl.textContent = `Rp ${(totalDion + totalNana).toLocaleString()}`;
  }

  function simpanKeLocalStorage() {
    localStorage.setItem('tabunganList', JSON.stringify(tabunganList));
  }

  window.hapusData = function(index) {
    if (confirm('Yakin ingin menghapus data ini?')) {
      tabunganList.splice(index, 1);
      simpanKeLocalStorage();
      renderTable();
    }
  };

  window.editData = function(index) {
    const data = tabunganList[index];
    document.getElementById('tanggal').value = data.tanggal;
    document.getElementById('nama').value = data.nama;
    document.getElementById('jumlah').value = data.jumlah;
    tabunganList.splice(index, 1); // hapus data lalu tambahkan saat disubmit ulang
    simpanKeLocalStorage();
    renderTable();
  };
</script>
