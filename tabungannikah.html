<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Catatan Tabungan Dion dan Nana</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #ffe6f0;
      color: #333;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #d63384;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #fff0f5;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    input, select, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      font-size: 1em;
    }

    button {
      background-color: #ff66b2;
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background-color: #e60073;
    }

    ul {
      margin-top: 20px;
      padding: 0;
      list-style: none;
    }

    li {
      background-color: #ffe6f0;
      padding: 10px;
      margin: 5px 0;
      border-left: 5px solid #d63384;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <h1>Catatan Tabungan Dion dan Nana</h1>
  <div class="container">
    <label for="nama">Pilih Nama:</label>
    <select id="nama">
      <option value="Dion">Dion</option>
      <option value="Nana">Nana</option>
    </select>

    <label for="jumlah">Jumlah Tabungan (Rp):</label>
    <input type="number" id="jumlah" placeholder="Masukkan jumlah..." />

    <button onclick="tambahTabungan()">Simpan Catatan</button>

    <ul id="daftarTabungan"></ul>
  </div>

  <script>
    const daftarTabungan = [];

    function tambahTabungan() {
      const nama = document.getElementById("nama").value;
      const jumlah = parseInt(document.getElementById("jumlah").value);

      if (!jumlah || jumlah <= 0) {
        alert("Masukkan jumlah yang valid.");
        return;
      }

      const catatan = `${nama} menabung sebesar Rp ${jumlah.toLocaleString()}`;
      daftarTabungan.push(catatan);
      tampilkanCatatan();
      document.getElementById("jumlah").value = "";
    }

    function tampilkanCatatan() {
      const list = document.getElementById("daftarTabungan");
      list.innerHTML = "";
      daftarTabungan.forEach(item => {
        const li = document.createElement("li");
        li.textContent = item;
        list.appendChild(li);
      });
    }
  </script>
</body>
</html>
